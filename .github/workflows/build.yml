name: Build ShadowTunnel APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          cd ShadowTunnel
          chmod +x gradlew || echo "no gradlew"
          ./gradlew assembleDebug || gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowTunnel-APK
          path: ShadowTunnel/app/build/outputs/apk/debug/*.apk
